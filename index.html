<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信聊天</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

.phone {
  width: 375px;
  height: 720px;
  background: #ededed;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.title-bar {
  height: 44px;
  background: #ededed;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 500;
  color: #000;
  border-bottom: 0.5px solid #d9d9d9;
  flex-shrink: 0;
}

.chat-area {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}

.message-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  animation: msgIn 0.3s ease forwards;
}

@keyframes msgIn {
  to { opacity: 1; transform: translateY(0); }
}

.message-row.self {
  flex-direction: row-reverse;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  flex-shrink: 0;
  background-size: cover;
  background-position: center;
}

.avatar.other {
  background: #c8c8c8 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect width="36" height="36" rx="4" fill="%23c8c8c8"/><text x="18" y="24" text-anchor="middle" font-size="14" fill="white">友</text></svg>') no-repeat;
}

.avatar.self {
  background: #95ec69 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect width="36" height="36" rx="4" fill="%2395ec69"/><text x="18" y="24" text-anchor="middle" font-size="14" fill="white">我</text></svg>') no-repeat;
}

.bubble {
  max-width: 260px;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.4;
  word-wrap: break-word;
  position: relative;
}

.bubble.other {
  background: #fff;
  color: #000;
}

.bubble.other::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 12px;
  border: 6px solid transparent;
  border-right-color: #fff;
  border-left: 0;
}

.bubble.self {
  background: #95ec69;
  color: #000;
}

.bubble.self::before {
  content: '';
  position: absolute;
  right: -6px;
  top: 12px;
  border: 6px solid transparent;
  border-left-color: #95ec69;
  border-right: 0;
}

.typing-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  animation: msgIn 0.3s ease forwards;
}

.typing-bubble {
  background: #fff;
  padding: 12px 14px;
  border-radius: 8px;
  position: relative;
  display: flex;
  gap: 4px;
  align-items: center;
  height: 38px;
}

.typing-bubble::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 12px;
  border: 6px solid transparent;
  border-right-color: #fff;
  border-left: 0;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #999;
  animation: typingBounce 1.2s infinite ease-in-out;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="title-bar">码道小助手</div>
  <div class="chat-area" id="chatArea"></div>
</div>
<script>
const chatArea = document.getElementById('chatArea');

const script = [
  { side: 'other', text: '在吗？' },
  { side: 'self', text: '在的，怎么啦？' },
  { side: 'other', text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？' },
  { side: 'self', text: '对，思路很简单' },
  { side: 'other', text: '满意就 commit，不满意就 checkout / reset 回退再改' },
  { side: 'self', text: '懂了，那我先去试试' },
  { side: 'other', text: '👍 有不懂的随时问' }
];

const TYPE_DELAY = 1500;
const MSG_DELAY = 600;
const RESTART_DELAY = 3000;

function scrollBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function createMessageRow(side, text) {
  const row = document.createElement('div');
  row.className = 'message-row' + (side === 'self' ? ' self' : '');
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + side;
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + side;
  bubble.textContent = text;
  row.appendChild(avatar);
  row.appendChild(bubble);
  return row;
}

function createTypingRow() {
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typingRow';
  const avatar = document.createElement('div');
  avatar.className = 'avatar other';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('div');
    dot.className = 'typing-dot';
    bubble.appendChild(dot);
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  return row;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playScript() {
  chatArea.innerHTML = '';
  scrollBottom();

  for (let i = 0; i < script.length; i++) {
    const msg = script[i];

    if (msg.side === 'other') {
      const typing = createTypingRow();
      chatArea.appendChild(typing);
      scrollBottom();
      await sleep(TYPE_DELAY);
      typing.remove();
    }

    const row = createMessageRow(msg.side, msg.text);
    chatArea.appendChild(row);
    scrollBottom();
    await sleep(MSG_DELAY);
  }

  await sleep(RESTART_DELAY);
  playScript();
}

playScript();
</script>
</body>
</html>
